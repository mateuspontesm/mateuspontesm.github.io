# About Section
# about_title: About Me
about_profile_image: images/globecom_avatar_2.png
about_content: | # this will include new lines to allow paragraphs
  Hello there.


  My name's Mateus and I'm a machine learning research scientist specializing in AI for wireless communications, with broader expertise in reinforcement learning, deep learning and learned compression.

  As a postdoc at CEA-Leti, I develop deep learning methods for semantic and goal-oriented communications: deep image compression, deep joint source-channel coding (DJSCC) and collaborative perception for connected agents. I also work on model-based RL and world models (Dreamer-style architectures).

  My PhD (INSA Lyon / Nokia Bell Labs) focused on multi-agent reinforcement learning for automated protocol design, where agents learn to communicate and coordinate in wireless networks. My Masters research was focused on reinforcement learning solutions for link adaptation in 5G.

  My core areas are reinforcement learning (multi-agent, model-based), world models, deep learning, learned compression, computer vision / cooperative perception, and 6G and AI-native networks.

